[project]
name = "borges-parser"
version = "0.1.0"
description = "Local stateless multimodal parser worker for Borges"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.10.0",
  "structlog>=24.4.0",
  "uvicorn>=0.32.0",
]

[dependency-groups]
dev = [
  "basedpyright>=1.22.0",
  "httpx>=0.28.0",
  "jsonschema>=4.23.0",
  "pytest>=8.3.0",
  "ruff>=0.8.0",
  "vulture>=2.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/borges_parser"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
